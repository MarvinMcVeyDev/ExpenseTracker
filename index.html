<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
        <body>
            <header>
                <img src="logo.png" alt="Expense Tracker Logo" id="logo">
                <div id="header-text">
                    <h1 id="expense-title"> Expense Tracker</h1>
                    <h3 id="expense-subtitle">Keep track of your bills. Stay in control!</h3>
                </div>
        </header>
        
            <div class="expense-text">
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <input type="number" step="0.01" id="expense-amount" placeholder="Amount" required>
                <input type="date" id="expense-date" placeholder="Date" required>
                <button type="submit" id="submit-expenses">Add Expense</button>
                <button type="button" id="clear-expenses">Clear Expenses</button>
                <button type="button" id="delete-expenses">Delete Selected</button>
            </form>

                
                
            <h3 class="total-expenses" ><span class="total-label">Total Expenses: </span><br><br><br>
                <span class="total-number">  $ <span id="total-expenses">0</span></span></h3>

        <div class="expense-list">
            <h2>Bills</h2>
                <table>
                    
                    <tr><th>&#9745</th><th>Expense</th> <th>Amount</th> <th>Date</th> </tr>
                    <tbody id="tableBody"></tbody>

                </table>
        </div>
    


            </div>
        </body>
        <script src="script.js"></script>
        </html>
